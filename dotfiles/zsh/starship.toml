"$schema" = 'https://starship.rs/config-schema.json'

# Styles use ANSI color names instead of hex values. Starship does not query
# the desktop itself, so the names resolve through the terminal's palette,
# which WezTerm swaps when the system appearance changes.
format = """
$os\
$username\
$directory\
$git_branch\
$git_status\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$conda\
$time\
$cmd_duration\
$line_break\
$character"""

[os]
disabled = false
style = "bold red"
format = '[ $symbol ]($style)'

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bold red"
style_root = "bold red"
format = '[ $user ]($style)'

[directory]
style = "bold blue"
format = '[ $path ]($style)'
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = " "
style = "bold magenta"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bold yellow"
format = '[ ($all_status$ahead_behind )]($style)'

[nodejs]
symbol = ""
style = "bold green"
format = '[$symbol $version ]($style)'

[c]
symbol = " "
style = "bold green"
format = '[$symbol $version ]($style)'

[rust]
symbol = ""
style = "bold green"
format = '[$symbol $version ]($style)'

[golang]
symbol = ""
style = "bold green"
format = '[$symbol $version ]($style)'

[php]
symbol = ""
style = "bold green"
format = '[$symbol $version ]($style)'

[java]
symbol = " "
style = "bold green"
format = '[$symbol $version ]($style)'

[kotlin]
symbol = ""
style = "bold green"
format = '[$symbol $version ]($style)'

[haskell]
symbol = ""
style = "bold green"
format = '[$symbol $version ]($style)'

[python]
symbol = ""
style = "bold green"
format = '[$symbol $version(\(#$virtualenv\)) ]($style)'

[conda]
symbol = "  "
style = "bold cyan"
format = '[ $symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "bold cyan"
format = '[ $time ]($style)'

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold green)'
vimcmd_replace_one_symbol = '[❮](bold magenta)'
vimcmd_replace_symbol = '[❮](bold magenta)'
vimcmd_visual_symbol = '[❮](bold yellow)'

[cmd_duration]
show_milliseconds = true
format = '[ $duration ]($style)'
style = "bold yellow"
disabled = false
show_notifications = true
min_time_to_notify = 45000
